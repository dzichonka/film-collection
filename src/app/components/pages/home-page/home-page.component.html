<ul class="movie-list">
  @if (movieService.movies.isLoading()) {
    <p>Loading...</p>
  }

  @if (movieService.movies.hasValue()) {
    @for (movie of movieService.movies.value(); track movie.id) {
      <li class="movie-item">
        <h3>{{ movie.title }}</h3>
        <img class="img" src="{{ movie.posterUrl }}" alt="{{ movie.title }} poster" />
      </li>
    }
  }
</ul>
