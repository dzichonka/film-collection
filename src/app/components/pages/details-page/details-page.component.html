@if (movieResource.isLoading()) {
  <p>Loading...</p>
}

@if (movieResource.hasValue()) {
  <div class="movie">
    <h3>{{ movieResource.value().title }}</h3>
    <p>{{ movieResource.value().description }}</p>
    <p>Year: {{ movieResource.value().year }}</p>
    <p>Genre: {{ movieResource.value().genre }}</p>
    <img
      class="img"
      src="{{ movieResource.value().posterUrl }}"
      alt="{{ movieResource.value().title }} poster"
    />
  </div>
}
