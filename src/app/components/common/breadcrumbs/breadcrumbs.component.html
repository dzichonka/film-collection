<ol class="breadcrumb">
  @for (bc of breadcrumbs(); track bc.url; let last = $last) {
    <li class="breadcrumb-item">
      @if (!last) {
        <a [routerLink]="bc.url" class="link">{{ bc.label }}</a>
        <span class="separator"> > </span>
      } @else {
        <span>{{ bc.label }}</span>
      }
    </li>
  }
</ol>
